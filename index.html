<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigsaw Jams Tracking</title>

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z7H7K002FN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        // Google Analytics Configuration
        gtag('config', 'G-Z7H7K002FN');
    </script>

    <!-- Google Ads Conversion Tracking -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16869228074"></script>
    <script>
        gtag('config', 'AW-16869228074');
    </script>
</head>
<body>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            console.log("Tracking script loaded");

            // Track "Product Clicks" when users interact with an item
            document.body.addEventListener("click", function (event) {
                let target = event.target;

                // Track product clicks
                if (target.matches(".product")) {
                    let productName = target.getAttribute("data-name") || "Unknown Product";
                    let price = parseFloat(target.getAttribute("data-price")) || 0;
                    
                    gtag('event', 'view_item', {
                        'send_to': 'AW-16869228074',
                        'event_category': 'Ecommerce',
                        'event_label': productName,
                        'value': price,
                        'currency': 'USD'
                    });

                    console.log("Product viewed:", productName, price);
                }

                // Track Add to Cart clicks
                if (target.matches(".add-to-cart")) {
                    let productName = target.getAttribute("data-name") || "Unknown Product";
                    let price = parseFloat(target.getAttribute("data-price")) || 0;

                    gtag('event', 'add_to_cart', {
                        'send_to': 'AW-16869228074',
                        'event_category': 'Ecommerce',
                        'event_label': productName,
                        'value': price,
                        'currency': 'USD'
                    });

                    console.log("Added to cart:", productName, price);
                }

                // Track Checkout clicks (purchase)
                if (target.matches("#checkout-button")) {
                    let totalValue = parseFloat(document.querySelector("#total-price")?.textContent || "0");
                    let transactionId = "ORDER-" + Math.floor(Math.random() * 1000000);

                    gtag('event', 'purchase', {
                        'send_to': 'AW-16869228074',
                        'transaction_id': transactionId,
                        'value': totalValue,
                        'currency': 'USD'
                    });

                    console.log("Purchase completed:", transactionId, totalValue);
                }
            });
        });
    </script>

</body>
</html>
