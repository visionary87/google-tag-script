<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jigsaw Jams Tracking</title>

    <!-- Google Analytics (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Z7H7K002FN"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        // Google Analytics Configuration
        gtag('config', 'G-Z7H7K002FN');
    </script>

    <!-- Google Ads Conversion Tracking -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=AW-16869228074"></script>
    <script>
        gtag('config', 'AW-16869228074');
    </script>
</head>
<body>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            console.log("Tracking script loaded");

            // Track Purchase Event with Google Ads Event Snippet
            function trackPurchase(transactionId, totalValue) {
                gtag('event', 'purchase_conversion', {  
                    'send_to': 'AW-16869228074/abcd1234xyz', // Replace with your actual Conversion Label
                    'transaction_id': transactionId,
                    'value': totalValue,
                    'currency': 'USD'
                });

                console.log("Purchase tracked:", transactionId, totalValue);
            }

            // Detect when a user clicks the checkout button
            document.body.addEventListener("click", function (event) {
                let target = event.target;

                if (target.matches("#checkout-button")) {
                    let transactionId = "ORDER-" + Math.floor(Math.random() * 1000000);
                    let totalValue = parseFloat(document.querySelector("#total-price")?.textContent || "0");

                    trackPurchase(transactionId, totalValue);
                }
            });

        });
    </script>

</body>
</html>
